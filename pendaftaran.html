<h2> Form Pendaftaran Praktikan</h2>
<form action="" method="post">
    <table>
        <tr>
            <td width="120">Nama</td>
            <td> <input type="text" /td>
        </tr>
         <tr>
            <td>Password</td>
            <td> <input type="password" /td>
        </tr>
         <tr>
            <td>NIM</td>
            <td> <input type="number" /td>
        </tr>
        <tr>
            <td>Tanggal Lahir</td>
            <td> <input type="date" /td>
        </tr>
        <tr>
            <td>Jenis Kelamin</td>
            <td> <input type="radio" name="jk"> Laki-laki 
            <input type="radio" name="jk"> Perempuan </td>
        </tr>
        <tr>
            <td>Minat Bidang</td>
            <td> <input type="checkbox"> Web
                <input type="checkbox"> Jaringan
                <input type="checkbox"> Design/Modeling </td>
        </tr>
        <tr>
            <td>Program Studi</td>
            <td> <select> 
                <option> S1 Teknik Informatika </option>
                <option> S1 Sistem Informasi </option>
            </select> </td>
        </tr> 
        <tr>
            <td>Alasan</td>
            <td> <textarea> </textarea> </td>
        </tr>
        <tr> 
            <td></td>
            <td> <input type="submit" value="Kirim">
            <input type="reset" value="Reset"> </td>
        </tr>
    </table>
</form>
